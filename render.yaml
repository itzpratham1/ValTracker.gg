services:
  # ── Flask API Backend ──
  - type: web
    name: valtracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py api:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: HENRIKDEV_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
